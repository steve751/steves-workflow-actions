[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-product-actions"
version = "0.2.3"
description = "Workflow engine actions that create a data product and set a structured property"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."datahub_actions.action.plugins"]
create_data_product = "data_product_actions.create_product:CreateDataProductAction"
set_data_product_property = "data_product_actions.set_property:SetDataProductPropertyAction"

[tool.setuptools.packages.find]
where = ["src"]
